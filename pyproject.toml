[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bellwether"
version = "0.1.0"
description = "Synthetic FP&A reporting and planning stack for an illustrative mid-market company"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "siddik-analytics" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The docs and docstrings deliberately use en dashes and the multiplication sign, because grain
# is written the way the data contract writes it ("SKU x location x day" reads worse, and the
# docstrings are the contract's counterpart in code). Ambiguous-character linting fights that
# for no benefit inside prose; it stays enabled for identifiers and string literals.
ignore = ["RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "requires_excel: test needs a local Excel installation via COM (Windows only; skipped in CI)",
]
