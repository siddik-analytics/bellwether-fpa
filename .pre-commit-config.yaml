# Guardrails that run before anything can enter history.
#
# The binary-rejection hook below is the important one. This repo generates workbooks, PDFs,
# PNGs and Excel lock files continuously; .gitignore covers the expected cases, but a single
# `git add -f` or an unanticipated filename is enough to put a binary permanently into a
# public history. The hook is the backstop that does not rely on anyone remembering.

default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-binary-artifacts
        name: reject build artifacts and Excel lock files
        language: fail
        entry: >-
          This file is a build artifact or an Excel lock file and must never be committed.
          Workbooks, PDFs and PNGs are generated by `python -m bellwether.build`; commit the
          code that produces them. Release artifacts are attached to a tag, not tracked.
        files: '(?i)(\.(xlsx|xlsm|xlsb|xls|pbix|pbit|pdf|docx|pptx)$|(^|/)~\$)'
