# CI runs on Linux with no Excel installed. That is the point of it.
#
# The project is authored on Windows and its final packaging stage drives Excel over COM.
# Running the acceptance suite somewhere Excel cannot exist is what turns "the build must not
# depend on Excel" from a rule people remember into a rule the machine enforces.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: headless build and acceptance suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Headless build
        run: python -m bellwether.build

      - name: Working tree is clean after a build
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The build left files git can see. Generated output must be gitignored."
            git status --porcelain --untracked-files=all
            exit 1
          fi

      - name: Acceptance suite
        run: python -m pytest -m "not requires_excel"
